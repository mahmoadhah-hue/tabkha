html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;line-height:1.6}

.mute{color:var(--mute);margin:0 0 16px}
.in{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.btn{padding:12px 18px;background:var(--acc);color:#fff;border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
.sm{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.del{color:var(--red)}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:stretch}
.dish{flex:1;display:flex;justify-content:space-between;align-items:center;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;font:inherit;color:inherit;text-align:right;cursor:pointer}
.dish small{color:var(--mute)}
.ing{flex:1;display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;font:inherit;color:inherit;text-align:right;cursor:pointer}
.box{flex:none;width:24px;height:24px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:800}
.ing.ok{background:var(--accbg);border-color:var(--acc)}
.ing.ok .box{background:var(--acc);border-color:var(--acc)}
.ing.ok .nm{text-decoration:line-through;opacity:.7}
.nm{flex:1}.q{color:var(--mute);font-size:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.form .in:first-child,.form .btn{grid-column:1/-1}
.empty{color:var(--mute);text-align:center;padding:22px 0}
.back{margin-bottom:14px}
textarea.in{height:90px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.sm.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 16px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mc{background:var(--accbg);border-radius:10px;padding:8px 2px;text-align:center}.mc b{display:block;font-size:18px;color:var(--acc)}.mc span{font-size:12px;color:var(--mute)}
.mt{font-size:12px;color:var(--mute);margin-top:8px}
.pt{font-size:13px;color:var(--mute);margin:8px 0 4px}
.pb{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:0 0 12px}.pb i{display:block;height:100%;background:var(--acc);transition:width .25s}
.mac{display:block;font-size:12px;color:var(--mute);font-weight:400;margin-top:2px}
details.man{grid-column:1/-1}details.man summary{cursor:pointer;color:var(--mute);font-size:14px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.form .mgrid .in:first-child{grid-column:auto}
button:focus-visible,.in:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
